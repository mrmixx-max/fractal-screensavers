<!DOCTYPE html>
<!--
  NEON FRACTAL DEEP-ZOOM — Cyberpunk-Edition mit echtem 1e-13-Zoom.
  Single-File, keine Abhängigkeiten, läuft offline.
  Technik: WebGL2, Hybrid-Renderer (float32 bis 1e-4, darunter Double-Single-
  Arithmetik im Shader). Steuerung: F = Vollbild, Leertaste = Pause, Esc = Ende.
  Feintuning oben im CONFIG-Block.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON // Fractal Deep-Zoom</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; width:100vw; height:100vh; }
  body.idle { cursor:none; }
  #hint {
    position:fixed; left:50%; bottom:6%; transform:translateX(-50%);
    color:#0ff; opacity:0; transition:opacity .6s; pointer-events:none;
    font:13px/1.4 'Courier New', monospace; letter-spacing:.18em;
    text-shadow:0 0 8px #f0f, 0 0 18px #0ff;
    background:rgba(10,0,20,.45); padding:8px 20px; border-radius:4px;
    border:1px solid rgba(0,255,255,.25);
  }
  #rec {
    position:fixed; right:20px; top:20px; z-index:100;
    background:rgba(10,0,20,.7); color:#0ff; border:1px solid rgba(0,255,255,.4);
    font:12px/1 'Courier New', monospace; letter-spacing:.1em;
    padding:8px 16px; border-radius:4px; cursor:pointer;
    text-shadow:0 0 6px #0ff; transition:all .3s;
    opacity:0; pointer-events:none;
  }
  body:not(.idle) #rec { opacity:1; pointer-events:auto; }
  #rec:hover { background:rgba(0,255,255,.2); border-color:#0ff; }
  #rec.recording { color:#f0f; border-color:#f0f; text-shadow:0 0 6px #f0f; animation:blink 1s infinite; opacity:1; pointer-events:auto; }
  @keyframes blink { 50% { opacity:.5; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">F = FULLSCREEN &nbsp;·&nbsp; SPACE = PAUSE &nbsp;·&nbsp; ESC = EXIT</div>
<button id="rec">● REC</button>
<script>
'use strict';
/* ============================== CONFIG ============================== */
const CONFIG = {
  trail           : 0.34,   // Motion-Trails (0 = aus, max ~0.6)
  grain           : 0.04,   // Film-Grain (0 = aus)
  aberration      : 0.0016, // chromatische Aberration am Bildrand (0 = aus)
  scanlines       : 0.05,   // Scanline-Abdunklung (0 = aus)
  rotationAmount  : 0.03,
  freq            : 0.06,   // Farbfrequenz (mehr = mehr Neon-Bänder)
  paletteSeconds  : 20,
  fadeSeconds     : 1.6,
  holdFraction    : 0.22,   // Verweil-Anteil am tiefsten Punkt
  juliaEvery      : 2,
  juliaSeconds    : 22,
  maxIterBase     : 300,
  maxIterZoomK    : 120,    // + Iterationen pro Zoom-Dekade
  maxIterCap      : 3500,
  minRenderScale  : 0.4,
  minIterQuality  : 0.4,
  dsThreshold     : 1e-4,   // darunter wird Double-Single-Arithmetik genutzt
  targets: [
    { c: [-0.7453,                 0.1127               ], from: 2.2, to: 6e-6,  dur: 42 }, // Seahorse-Arme (Warm-up)
    { c: [-0.743643887037151,      0.131825904205330    ], from: 2.0, to: 1e-13, dur: 78 }, // Seahorse Valley DEEP
    { c: [ 0.28693186889504513,    0.014286693904085048 ], from: 0.9, to: 1e-13, dur: 72 }, // Elefanten-Tal DEEP
    { c: [-0.745428,               0.113009             ], from: 0.8, to: 1e-5,  dur: 40 }, // Spiralen
    { c: [-1.4011551890920506,     0.0                  ], from: 0.5, to: 1e-13, dur: 70 }, // Feigenbaum DEEP
    { c: [-1.768778833,            0.001738996          ], from: 0.5, to: 2e-5,  dur: 38 }, // Minibrot-Region
  ],
  juliaConstants: [
    [-0.70176, -0.3842], [-0.8, 0.156], [0.285, 0.01],
    [-0.835, -0.2321], [0.355, 0.355], [-0.54, 0.54],
  ],
};
/* ============================ KONSTANTEN ============================ */
const PAL_ORDER = [0, 2, 4, 1, 5, 3];
const MAXI_FLOAT = 1400;
const MAXI_DS    = 6000; // hartes Loop-Limit im Deep-Zoom-Shader
const fr = Math.fround;

const canvas = document.getElementById('c');
const hint = document.getElementById('hint');

/* ------------------------------ State ------------------------------ */
let legs = [];
{
  let j = 0;
  CONFIG.targets.forEach((t, i) => {
    legs.push({ type:'m', c:t.c, from:t.from ?? 2.2, to:t.to, dur:t.dur ?? 46 });
    if (CONFIG.juliaEvery > 0 && (i % CONFIG.juliaEvery) === CONFIG.juliaEvery - 1) {
      legs.push({ type:'j', cj:CONFIG.juliaConstants[j++ % CONFIG.juliaConstants.length], dur:CONFIG.juliaSeconds });
    }
  });
}
let legIndex = 0, legTime = 0, clock = 0;
let manualPause = false;

const lerp = (a,b,t)=>a+(b-a)*t;
const smooth01 = x => x<=0?0 : x>=1?1 : x*x*(3-2*x);

function currentState(){
  const leg = legs[legIndex];
  const t = legTime / leg.dur;
  let center, scale, julia = 0, juliaC = [0,0];
  if (leg.type === 'm'){
    const zp = Math.min(t / (1 - CONFIG.holdFraction), 1);
    const e = zp*zp*(3-2*zp);
    scale = Math.exp(lerp(Math.log(leg.from), Math.log(leg.to), e));
    center = leg.c;
  } else {
    julia = 1; center = [0,0];
    scale = 1.6 * (1 + 0.05*Math.sin(clock*0.2));
    const a = t * Math.PI * 2;
    juliaC = [ leg.cj[0] + 0.012*Math.cos(a), leg.cj[1] + 0.012*Math.sin(a) ];
  }
  const rot = Math.sin(clock*0.13) * CONFIG.rotationAmount;
  const fade = Math.min(smooth01(legTime/CONFIG.fadeSeconds),
                        smooth01((leg.dur-legTime)/CONFIG.fadeSeconds));
  const maxIter = Math.round(Math.min(
    CONFIG.maxIterBase + CONFIG.maxIterZoomK * Math.log10(3/scale),
    CONFIG.maxIterCap));
  const P = CONFIG.paletteSeconds, i = Math.floor(clock/P), f = clock - i*P;
  const m = f > P-3 ? smooth01((f-(P-3))/3) : 0;
  return { center, scale, julia, juliaC, rot, fade, maxIter,
           palA: PAL_ORDER[i % PAL_ORDER.length],
           palB: PAL_ORDER[(i+1) % PAL_ORDER.length],
           palMix: m,
           trail: (leg.type==='m' && t > 1-CONFIG.holdFraction) ? CONFIG.trail*0.4 : CONFIG.trail };
}

/* ============================ SHADER ============================ */
const VS = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUV;
void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.,1.); }`;

// Cyberpunk-Neon-Paletten: dunkle Täler, heiße Peaks
const PAL_GLSL = `
vec3 pal(float t, int idx){
  vec3 a, b, c = vec3(1.0), d;
  if      (idx==0){ a=vec3(0.05,0.00,0.15); b=vec3(0.95,0.35,0.85); d=vec3(0.00,0.15,0.35); } // magenta/cyan
  else if (idx==1){ a=vec3(0.00,0.05,0.10); b=vec3(0.40,0.95,0.90); d=vec3(0.10,0.30,0.00); } // cyan/lime
  else if (idx==2){ a=vec3(0.15,0.00,0.05); b=vec3(0.85,0.45,0.35); d=vec3(0.00,0.10,0.25); } // hot pink/orange
  else if (idx==3){ a=vec3(0.08,0.02,0.12); b=vec3(0.75,0.85,0.60); d=vec3(0.20,0.00,0.40); } // violet/acid
  else if (idx==4){ a=vec3(0.02,0.00,0.10); b=vec3(0.35,0.55,0.90); d=vec3(0.30,0.20,0.10); } // blue/purple
  else            { a=vec3(0.08,0.02,0.10); b=vec3(0.85,0.60,0.80); d=vec3(0.00,0.33,0.67); } // neon rainbow
  return a + b*cos(6.2831853*(c*t+d));
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
`;

const POST_GLSL = `
  float l = dot(col, vec3(0.299,0.587,0.114));
  col = mix(vec3(l), col, 1.25);
  col = pow(max(col, 0.0), vec3(1.1));
  col *= uFade;
  float vig = 1.0 - smoothstep(0.45, 0.95, distance(vUV, vec2(0.5)));
  col *= 0.60 + 0.40*vig;
  col += (hash(vUV*uRes + fract(uTime)*371.0) - 0.5) * uGrain;
  outColor = vec4(clamp(col, 0.0, 1.0), 1.0);
`;

// Schneller float32-Pfad (Zoom > dsThreshold)
const FS_FLOAT = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 outColor;
uniform vec2 uRes; uniform vec2 uCenter; uniform float uScale, uRot;
uniform int uMaxIter; uniform float uJulia; uniform vec2 uJuliaC;
uniform int uPalA, uPalB; uniform float uPalMix, uTime, uFade, uFreq, uGrain;
${PAL_GLSL}
void main(){
  vec2 p = (vUV - 0.5) * vec2(uRes.x/uRes.y, 1.0);
  float cr = cos(uRot), sr = sin(uRot);
  p = mat2(cr,-sr,sr,cr) * p;
  vec2 pix = uCenter + p * uScale;
  vec2 c = mix(pix, uJuliaC, uJulia);
  vec2 z = mix(vec2(0.0), pix, uJulia);
  float sn = -1.0;
  for (int i=0;i<${MAXI_FLOAT};i++){
    if (i >= uMaxIter) break;
    z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
    if (dot(z,z) > 65536.0){ sn = float(i); break; }
  }
  vec3 col;
  if (sn < 0.0){
    col = pal(uTime*0.02, uPalA) * 0.04;
  } else {
    float lz = 0.5*log(dot(z,z));
    float nu = log(lz*1.442695)*1.442695;
    float tt = (sn + 1.0 - nu)*uFreq + uTime*0.015;
    col = mix(pal(tt, uPalA), pal(tt, uPalB), uPalMix);
  }
${POST_GLSL}
}`;

// Deep-Zoom-Pfad: Double-Single-Arithmetik (2x float32 ≈ 48 Bit Mantisse)
const FS_DS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 outColor;
uniform vec2 uRes; uniform vec4 uCenterDS; uniform float uScale, uRot;
uniform int uMaxIter;
uniform int uPalA, uPalB; uniform float uPalMix, uTime, uFade, uFreq, uGrain;
${PAL_GLSL}
vec2 ds_add(vec2 a, vec2 b){
  precise float t1 = a.x + b.x;
  precise float e  = t1 - a.x;
  precise float t2 = ((b.x - e) + (a.x - (t1 - e))) + a.y + b.y;
  precise float hi = t1 + t2;
  precise float lo = t2 - (hi - t1);
  return vec2(hi, lo);
}
vec2 ds_sub(vec2 a, vec2 b){ return ds_add(a, vec2(-b.x, -b.y)); }
vec2 ds_mul(vec2 a, vec2 b){
  const float SPLIT = 8193.0;
  precise float ca = a.x*SPLIT; precise float ahi = ca - (ca - a.x); precise float alo = a.x - ahi;
  precise float cb = b.x*SPLIT; precise float bhi = cb - (cb - b.x); precise float blo = b.x - bhi;
  precise float c11 = a.x*b.x;
  precise float err = ((ahi*bhi - c11) + ahi*blo + alo*bhi) + alo*blo;
  precise float c2  = a.x*b.y + a.y*b.x;
  precise float t2  = err + c2;
  precise float hi  = c11 + t2;
  precise float lo  = t2 - (hi - c11);
  return vec2(hi, lo);
}
void main(){
  vec2 p = (vUV - 0.5) * vec2(uRes.x/uRes.y, 1.0);
  float cr = cos(uRot), sr = sin(uRot);
  p = mat2(cr,-sr,sr,cr) * p;
  vec2 off = p * uScale;
  vec2 cx = ds_add(vec2(uCenterDS.x, uCenterDS.y), vec2(off.x, 0.0));
  vec2 cy = ds_add(vec2(uCenterDS.z, uCenterDS.w), vec2(off.y, 0.0));
  vec2 zx = vec2(0.0), zy = vec2(0.0);
  float sn = -1.0;
  for (int i=0;i<${MAXI_DS};i++){
    if (i >= uMaxIter) break;
    vec2 x2 = ds_mul(zx, zx);
    vec2 y2 = ds_mul(zy, zy);
    vec2 xy = ds_mul(zx, zy);
    zx = ds_add(ds_sub(x2, y2), cx);
    zy = ds_add(ds_add(xy, xy), cy);
    float m2 = zx.x*zx.x + zy.x*zy.x;
    if (m2 > 65536.0){ sn = float(i); break; }
  }
  vec3 col;
  if (sn < 0.0){
    col = pal(uTime*0.02, uPalA) * 0.04;
  } else {
    float m2 = zx.x*zx.x + zy.x*zy.x;
    float lz = 0.5*log(m2);
    float nu = log(lz*1.442695)*1.442695;
    float tt = (sn + 1.0 - nu)*uFreq + uTime*0.015;
    col = mix(pal(tt, uPalA), pal(tt, uPalB), uPalMix);
  }
${POST_GLSL}
}`;

const FS_FEEDBACK = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uCur, uHist; uniform float uTrail;
void main(){
  vec2 uv2 = clamp((vUV - 0.5)/1.004 + 0.5, 0.0, 1.0);
  vec3 cur  = texture(uCur,  vUV).rgb;
  vec3 hist = texture(uHist, uv2).rgb * 0.985;
  o = vec4(mix(cur, hist, uTrail), 1.0);
}`;

// Final-Pass mit Cyberpunk-Post: chromatische Aberration + Scanlines
const FS_BLIT = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uTex; uniform float uAberr, uScan;
void main(){
  vec2 dir = vUV - 0.5;
  float r = texture(uTex, vUV + dir*uAberr).r;
  float g = texture(uTex, vUV).g;
  float b = texture(uTex, vUV - dir*uAberr).b;
  vec3 col = vec3(r,g,b);
  col *= 1.0 - uScan*(0.5 + 0.5*sin(gl_FragCoord.y*3.14159265));
  o = vec4(col, 1.0);
}`;

/* ============================ WEBGL-PFAD ============================ */
function startWebGL(gl){
  const sh = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = (fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i=0;i<n;i++){ const inf = gl.getActiveUniform(p,i); u[inf.name] = gl.getUniformLocation(p, inf.name); }
    return { p, u };
  };

  const pFloat = prog(FS_FLOAT);
  let pDS = null;
  try { pDS = prog(FS_DS); } catch(e) { console.warn('DS-Shader nicht verfügbar:', e); }
  const pFeed = prog(FS_FEEDBACK), pBlit = prog(FS_BLIT);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const mkTex = (w,h) => {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return ok ? { t, f, w, h } : null;
  };

  let renderScale = 1, iterQ = 1, frac = null, histA = null, histB = null, useTrails = true;

  function allocTargets(){
    const W = canvas.width, H = canvas.height;
    frac  = mkTex(Math.max(2, Math.round(W*renderScale)), Math.max(2, Math.round(H*renderScale)));
    histA = mkTex(W, H); histB = mkTex(W, H);
    useTrails = !!(frac && histA && histB);
  }
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(canvas.clientWidth  * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    allocTargets();
  }
  resize();
  window.addEventListener('resize', resize);

  let emaDt = 1/60, adaptCooldown = 0;
  function adapt(dt){
    emaDt = emaDt*0.95 + dt*0.05;
    adaptCooldown -= dt;
    if (adaptCooldown > 0) return;
    if (emaDt > 1/45){
      if (renderScale > CONFIG.minRenderScale) renderScale = Math.max(CONFIG.minRenderScale, renderScale - 0.1), allocTargets();
      else if (iterQ > CONFIG.minIterQuality) iterQ = Math.max(CONFIG.minIterQuality, iterQ - 0.1);
      adaptCooldown = 1.5;
    } else if (emaDt < 1/58){
      if (iterQ < 1) iterQ = Math.min(1, iterQ + 0.1);
      else if (renderScale < 1) renderScale = Math.min(1, renderScale + 0.1), allocTargets();
      adaptCooldown = 1.5;
    }
  }

  const drawTri = () => gl.drawArrays(gl.TRIANGLES, 0, 3);

  return function frame(dt){
    adapt(dt);
    const s = currentState();
    const deep = pDS && s.julia < 0.5 && s.scale < CONFIG.dsThreshold;
    const pr = deep ? pDS : pFloat;
    const scale = (!pDS && s.julia < 0.5) ? Math.max(s.scale, 2e-6) : s.scale;

    gl.useProgram(pr.p);
    gl.uniform2f(pr.u.uRes, frac ? frac.w : canvas.width, frac ? frac.h : canvas.height);
    if (deep){
      const hix = fr(s.center[0]), hiy = fr(s.center[1]);
      gl.uniform4f(pr.u.uCenterDS, hix, s.center[0]-hix, hiy, s.center[1]-hiy);
    } else {
      gl.uniform2f(pr.u.uCenter, s.center[0], s.center[1]);
      gl.uniform1f(pr.u.uJulia, s.julia);
      gl.uniform2f(pr.u.uJuliaC, s.juliaC[0], s.juliaC[1]);
    }
    gl.uniform1f(pr.u.uScale, scale);
    gl.uniform1f(pr.u.uRot, s.rot);
    gl.uniform1i(pr.u.uMaxIter, Math.max(150, Math.round(s.maxIter * iterQ)));
    gl.uniform1i(pr.u.uPalA, s.palA);
    gl.uniform1i(pr.u.uPalB, s.palB);
    gl.uniform1f(pr.u.uPalMix, s.palMix);
    gl.uniform1f(pr.u.uTime, clock);
    gl.uniform1f(pr.u.uFade, s.fade);
    gl.uniform1f(pr.u.uFreq, CONFIG.freq);
    gl.uniform1f(pr.u.uGrain, CONFIG.grain);

    if (useTrails){
      gl.bindFramebuffer(gl.FRAMEBUFFER, frac.f);
      gl.viewport(0, 0, frac.w, frac.h);
      drawTri();

      gl.useProgram(pFeed.p);
      gl.uniform1f(pFeed.u.uTrail, s.trail);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, frac.t);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, histA.t);
      gl.uniform1i(pFeed.u.uCur, 0); gl.uniform1i(pFeed.u.uHist, 1);
      gl.bindFramebuffer(gl.FRAMEBUFFER, histB.f);
      gl.viewport(0, 0, histB.w, histB.h);
      drawTri();

      gl.useProgram(pBlit.p);
      gl.uniform1f(pBlit.u.uAberr, CONFIG.aberration);
      gl.uniform1f(pBlit.u.uScan, CONFIG.scanlines);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, histB.t);
      gl.uniform1i(pBlit.u.uTex, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      drawTri();

      const tmp = histA; histA = histB; histB = tmp;
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      drawTri();
    }
  };
}

/* ============ 2D-FALLBACK (kein WebGL2; JS-double zoomt nativ tief) ============ */
function startFallback2D(){
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');
  let fbW = 300, emaMs = 16;

  function palJS(t, idx){
    const sets = [
      [[.05,0,.15],[.95,.35,.85],[1,1,1],[0,.15,.35]],
      [[0,.05,.10],[.40,.95,.90],[1,1,1],[.10,.30,0]],
      [[.15,0,.05],[.85,.45,.35],[1,1,1],[0,.10,.25]],
      [[.08,.02,.12],[.75,.85,.60],[1,1,1],[.20,0,.40]],
      [[.02,0,.10],[.35,.55,.90],[1,1,1],[.30,.20,.10]],
      [[.08,.02,.10],[.85,.60,.80],[1,1,1],[0,.33,.67]],
    ];
    const [a,b,c,d] = sets[idx % sets.length];
    const TAU = Math.PI*2;
    return [0,1,2].map(k => a[k] + b[k]*Math.cos(TAU*(c[k]*t + d[k])));
  }

  return function frame(){
    const W = canvas.width, H = canvas.height;
    const fbH = Math.max(2, Math.round(fbW * H / W));
    if (off.width !== fbW || off.height !== fbH){ off.width = fbW; off.height = fbH; }
    const s = currentState();
    const img = octx.createImageData(fbW, fbH);
    const d = img.data;
    const maxIter = Math.min(s.maxIter, 600);
    const t0 = performance.now();

    for (let y=0; y<fbH; y++){
      for (let x=0; x<fbW; x++){
        let px = (x/fbW - 0.5) * (W/H), py = (y/fbH - 0.5);
        const cr = Math.cos(s.rot), sr = Math.sin(s.rot);
        const rx = px*cr - py*sr, ry = px*sr + py*cr;
        const cx0 = lerp(s.center[0] + rx*s.scale, s.juliaC[0], s.julia);
        const cy0 = lerp(s.center[1] + ry*s.scale, s.juliaC[1], s.julia);
        let zx = lerp(0, s.center[0] + rx*s.scale, s.julia);
        let zy = lerp(0, s.center[1] + ry*s.scale, s.julia);
        let sn = -1;
        for (let i=0; i<maxIter; i++){
          const x2 = zx*zx - zy*zy + cx0, y2 = 2*zx*zy + cy0;
          zx = x2; zy = y2;
          if (zx*zx + zy*zy > 65536){ sn = i; break; }
        }
        let r=0, g=0, b=0;
        if (sn >= 0){
          const lz = 0.5*Math.log(zx*zx + zy*zy);
          const nu = Math.log(lz*1.442695)*1.442695;
          const tt = (sn + 1 - nu) * CONFIG.freq + clock*0.015;
          const ca = palJS(tt, s.palA), cb = palJS(tt, s.palB);
          r = lerp(ca[0], cb[0], s.palMix); g = lerp(ca[1], cb[1], s.palMix); b = lerp(ca[2], cb[2], s.palMix);
        }
        r *= s.fade; g *= s.fade; b *= s.fade;
        const k = (y*fbW + x) * 4;
        d[k] = Math.min(255, r*255); d[k+1] = Math.min(255, g*255); d[k+2] = Math.min(255, b*255); d[k+3] = 255;
      }
    }
    octx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(off, 0, 0, W, H);

    emaMs = emaMs*0.9 + (performance.now()-t0)*0.1;
    if (emaMs > 90 && fbW > 200) fbW = Math.round(fbW*0.8);
  };
}

/* ============================ MAIN LOOP ============================ */
let renderFrame;
try {
  const gl = canvas.getContext('webgl2', { antialias:false, alpha:false });
  if (!gl) throw new Error('no webgl2');
  renderFrame = startWebGL(gl);
} catch (e) {
  renderFrame = startFallback2D();
}

let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min((now - last)/1000, 0.1);
  last = now;
  if (document.hidden || manualPause) return;
  clock += dt;
  legTime += dt;
  if (legTime >= legs[legIndex].dur){ legTime = 0; legIndex = (legIndex+1) % legs.length; }
  renderFrame(dt);
}
requestAnimationFrame(loop);

/* ====================== SCREENSAVER-VERHALTEN ====================== */
let idleTimer = null, hintTimer = null;
function activity(){
  document.body.classList.remove('idle');
  hint.style.opacity = 1;
  clearTimeout(idleTimer); clearTimeout(hintTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  hintTimer = setTimeout(() => hint.style.opacity = 0, 2200);
}
['mousemove','mousedown','keydown','touchstart'].forEach(ev =>
  window.addEventListener(ev, activity, { passive:true }));
activity();

function toggleFullscreen(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
window.addEventListener('keydown', e => {
  if(e.key === 'f' || e.key === 'F') toggleFullscreen();
  if(e.key === ' ') { manualPause = !manualPause; e.preventDefault(); }
});
window.addEventListener('dblclick', toggleFullscreen);

/* ====================== CANVAS RECORDER ====================== */
const recBtn = document.getElementById('rec');
let mediaRecorder = null;
let recordedChunks = null;

recBtn.addEventListener('click', () => {
  if(mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
    return;
  }

  // Capture canvas at 60fps
  const stream = canvas.captureStream(60);
  recordedChunks = [];

  // Pick best supported codec
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
             : MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8'
             : 'video/webm';

  mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
  mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fractal-neon-' + Date.now() + '.webm';
    a.click();
    URL.revokeObjectURL(url);
    recBtn.textContent = '● REC';
    recBtn.classList.remove('recording');
  };

  mediaRecorder.start();
  recBtn.textContent = '■ STOP';
  recBtn.classList.add('recording');
});
</script>
