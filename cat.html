<!DOCTYPE html>
<!--
  CAT SCREENSAVER — Single-File, keine Abhängigkeiten, läuft offline.
  Viele animierte Katzen: Gehende, springende, schlafende, fische jagende Katzen.
  Steuerung: F = Vollbild, Leertaste = Pause, Esc = Beenden.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐱 Cat Screensaver</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:linear-gradient(135deg,#1a0a2e 0%,#16213e 50%,#0f3460 100%); }
  canvas { display:block; width:100vw; height:100vh; }
  body.idle { cursor:none; }
  #hint {
    position:fixed; left:50%; bottom:6%; transform:translateX(-50%);
    color:#fff; opacity:0; transition:opacity .6s; pointer-events:none;
    font:13px/1.4 system-ui,sans-serif; letter-spacing:.08em;
    background:rgba(0,0,0,.4); padding:8px 20px; border-radius:20px;
    text-shadow:0 0 8px #ff66aa;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">F = Vollbild &nbsp;·&nbsp; Leertaste = Pause &nbsp;·&nbsp; Esc = Beenden</div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  W = canvas.width; H = canvas.height;
}
resize();
addEventListener('resize', resize);

// === KATZEN-SPRITES ===
function drawCat(x, y, size, color, dir, frame, action) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  
  const s = size / 40;
  const bodyColor = color;
  const darkColor = shade(color, -30);
  
  // Bewegung
  let bobY = 0, legOffset = 0;
  if (action === 'walk') {
    bobY = Math.sin(frame * 0.3) * 2 * s;
    legOffset = Math.sin(frame * 0.3);
  } else if (action === 'jump') {
    bobY = -Math.sin((frame % 60) / 60 * Math.PI) * 30 * s;
  }
  
  // Schwanz
  ctx.strokeStyle = bodyColor;
  ctx.lineWidth = 4 * s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  const tailWag = Math.sin(frame * 0.15) * 15;
  ctx.moveTo(-15 * s, bobY - 5 * s);
  ctx.quadraticCurveTo(-25 * s, bobY - 20 * s + tailWag, -20 * s, bobY - 30 * s);
  ctx.stroke();
  
  // Beine
  ctx.fillStyle = bodyColor;
  const legY = 10 * s;
  const legH = 12 * s;
  // Vorne
  ctx.fillRect(-8 * s + legOffset * 5 * s, legY, 4 * s, legH);
  ctx.fillRect(4 * s - legOffset * 5 * s, legY, 4 * s, legH);
  // Hinten
  ctx.fillRect(-12 * s - legOffset * 5 * s, legY, 4 * s, legH);
  ctx.fillRect(8 * s + legOffset * 5 * s, legY, 4 * s, legH);
  
  // Körper
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(0, bobY, 18 * s, 12 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Kopf
  ctx.beginPath();
  ctx.arc(12 * s, bobY - 10 * s, 10 * s, 0, Math.PI * 2);
  ctx.fill();
  
  // Ohren
  ctx.fillStyle = darkColor;
  ctx.beginPath();
  ctx.moveTo(6 * s, bobY - 16 * s);
  ctx.lineTo(3 * s, bobY - 28 * s);
  ctx.lineTo(10 * s, bobY - 20 * s);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(16 * s, bobY - 16 * s);
  ctx.lineTo(19 * s, bobY - 28 * s);
  ctx.lineTo(13 * s, bobY - 20 * s);
  ctx.fill();
  
  // Augen
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(9 * s, bobY - 11 * s, 3 * s, 3.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(16 * s, bobY - 11 * s, 3 * s, 3.5 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(10 * s, bobY - 11 * s, 1.5 * s, 2 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(17 * s, bobY - 11 * s, 1.5 * s, 2 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  
  // Nase
  ctx.fillStyle = '#ff9999';
  ctx.beginPath();
  ctx.moveTo(12.5 * s, bobY - 7 * s);
  ctx.lineTo(11.5 * s, bobY - 5 * s);
  ctx.lineTo(13.5 * s, bobY - 5 * s);
  ctx.fill();
  
  // Schnurrhaare
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1 * s;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.moveTo(8 * s, bobY - 6 * s + i * 3 * s);
    ctx.lineTo(2 * s, bobY - 8 * s + i * 4 * s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(17 * s, bobY - 6 * s + i * 3 * s);
    ctx.lineTo(23 * s, bobY - 8 * s + i * 4 * s);
    ctx.stroke();
  }
  
  ctx.restore();
}

// === FISCH ===
function drawFish(x, y, size, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, size, size * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Flosse
  ctx.beginPath();
  ctx.moveTo(-size * 0.6, 0);
  ctx.lineTo(-size * 1.2, -size * 0.5);
  ctx.lineTo(-size * 1.2, size * 0.5);
  ctx.fill();
  // Auge
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(size * 0.5, -size * 0.1, size * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// === PAWTO PRINT ===
function drawPaw(x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffccaa';
  // Hauptpads
  ctx.beginPath();
  ctx.ellipse(x, y, size * 0.8, size * 0.6, 0, 0, Math.PI * 2);
  ctx.fill();
  // Zehen
  for (let i = -1.5; i <= 1.5; i++) {
    ctx.beginPath();
    ctx.arc(x + i * size * 0.5, y - size * 0.7, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

// === STERN / GLITTER ===
function drawStar(x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffdd44';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const method = i === 0 ? 'moveTo' : 'lineTo';
    ctx[method](x + Math.cos(angle) * size, y + Math.sin(angle) * size);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function shade(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, Math.min(255, (num >> 16) + amt));
  const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
  const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

// === KATZEN-ARRAY ===
const cats = [];
const CAT_COLORS = ['#ff9966', '#ff6699', '#cc99ff', '#66ffcc', '#ffcc66', '#6699ff', '#ff6666', '#99ff66', '#ff99cc', '#99ccff'];
const FISH_COLORS = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff'];

function initCats() {
  cats.length = 0;
  const numCats = 15 + Math.floor(Math.random() * 10);
  for (let i = 0; i < numCats; i++) {
    cats.push({
      x: Math.random() * W,
      y: H * 0.3 + Math.random() * H * 0.6,
      size: 30 + Math.random() * 40,
      color: CAT_COLORS[Math.floor(Math.random() * CAT_COLORS.length)],
      dir: Math.random() > 0.5 ? 1 : -1,
      speed: 0.5 + Math.random() * 2,
      action: Math.random() > 0.7 ? 'jump' : 'walk',
      frame: Math.random() * 100,
      targetX: Math.random() * W,
      waiting: 0,
      sleepTimer: Math.random() * 200
    });
  }
}

// === FISCHE ===
const fishes = [];
function initFishes() {
  fishes.length = 0;
  const numFish = 8 + Math.floor(Math.random() * 6);
  for (let i = 0; i < numFish; i++) {
    fishes.push({
      x: Math.random() * W,
      y: H * 0.2 + Math.random() * H * 0.5,
      size: 8 + Math.random() * 12,
      color: FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)],
      speedX: (Math.random() - 0.5) * 2,
      speedY: (Math.random() - 0.5) * 0.5,
      phase: Math.random() * Math.PI * 2
    });
  }
}

// === SCHLAFZIMMER-KATZEN ===
const sleepingCats = [];
function initSleepingCats() {
  sleepingCats.length = 0;
  const numSleep = 5 + Math.floor(Math.random() * 5);
  for (let i = 0; i < numSleep; i++) {
    sleepingCats.push({
      x: Math.random() * W,
      y: H * 0.5 + Math.random() * H * 0.4,
      size: 25 + Math.random() * 30,
      color: CAT_COLORS[Math.floor(Math.random() * CAT_COLORS.length)],
      dir: Math.random() > 0.5 ? 1 : -1,
      breathPhase: Math.random() * Math.PI * 2
    });
  }
}

// === STERNE ===
const stars = [];
function initStars() {
  stars.length = 0;
  const numStars = 30 + Math.floor(Math.random() * 20);
  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.6,
      size: 3 + Math.random() * 6,
      twinkle: Math.random() * Math.PI * 2
    });
  }
}

// === PAW PRINTS ===
const pawPrints = [];

// === MAIN LOOP ===
let paused = false;
let frame = 0;

function init() {
  initCats();
  initFishes();
  initSleepingCats();
  initStars();
  pawPrints.length = 0;
}

function update() {
  if (paused) return;
  frame++;
  
  // Katzen updaten
  for (const cat of cats) {
    cat.frame++;
    cat.sleepTimer--;
    
    if (cat.sleepTimer <= 0 && cat.action !== 'jump') {
      cat.action = 'walk';
    }
    
    if (cat.action === 'walk') {
      const dx = cat.targetX - cat.x;
      if (Math.abs(dx) < 5) {
        cat.targetX = Math.random() * W;
        cat.dir = cat.targetX > cat.x ? 1 : -1;
        if (Math.random() > 0.7) {
          cat.action = 'jump';
          cat.frame = 0;
        } else if (Math.random() > 0.8) {
          cat.sleepTimer = 100 + Math.random() * 200;
        }
      } else {
        cat.x += cat.speed * cat.dir;
      }
    } else if (cat.action === 'jump') {
      cat.x += cat.speed * cat.dir * 0.5;
      if (cat.frame > 60) {
        cat.action = 'walk';
        cat.targetX = Math.random() * W;
      }
    }
    
    // Begrenzung
    if (cat.x < -50) cat.x = W + 50;
    if (cat.x > W + 50) cat.x = -50;
    
    // Pfotenabdruck hinterlassen
    if (frame % 30 === 0 && cat.action === 'walk') {
      pawPrints.push({ x: cat.x, y: cat.y + 20, size: cat.size * 0.3, alpha: 0.4 });
      if (pawPrints.length > 100) pawPrints.shift();
    }
  }
  
  // Fische updaten
  for (const fish of fishes) {
    fish.phase += 0.05;
    fish.x += fish.speedX + Math.sin(fish.phase) * 0.3;
    fish.y += fish.speedY + Math.cos(fish.phase * 0.7) * 0.2;
    if (fish.x < -20) fish.x = W + 20;
    if (fish.x > W + 20) fish.x = -20;
    if (fish.y < 0 || fish.y > H * 0.8) fish.speedY *= -1;
  }
  
  // Sterne funkeln
  for (const star of stars) {
    star.twinkle += 0.05;
  }
  
  // Schlafende Katzen atmen
  for (const scat of sleepingCats) {
    scat.breathPhase += 0.03;
  }
  
  // Pfotenabdrücke verblassen
  for (let i = pawPrints.length - 1; i >= 0; i--) {
    pawPrints[i].alpha -= 0.002;
    if (pawPrints[i].alpha <= 0) pawPrints.splice(i, 1);
  }
}

function draw() {
  // Hintergrund
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0020');
  grad.addColorStop(0.5, '#1a0a3e');
  grad.addColorStop(1, '#0a1a3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  // Mond
  ctx.fillStyle = '#ffeedd';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.15, 40, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0a0020';
  ctx.beginPath();
  ctx.arc(W * 0.8 + 15, H * 0.15 - 5, 35, 0, Math.PI * 2);
  ctx.fill();
  
  // Sterne
  for (const star of stars) {
    const alpha = 0.3 + Math.sin(star.twinkle) * 0.3;
    drawStar(star.x, star.y, star.size, alpha);
  }
  
  // Pfotenabdrücke
  for (const paw of pawPrints) {
    drawPaw(paw.x, paw.y, paw.size, paw.alpha);
  }
  
  // Fische
  for (const fish of fishes) {
    ctx.save();
    ctx.translate(fish.x, fish.y);
    ctx.scale(fish.speedX > 0 ? 1 : -1, 1);
    drawFish(0, 0, fish.size, fish.color);
    ctx.restore();
  }
  
  // Schlafende Katzen
  for (const scat of sleepingCats) {
    const breathScale = 1 + Math.sin(scat.breathPhase) * 0.05;
    ctx.save();
    ctx.translate(scat.x, scat.y);
    ctx.scale(scat.dir, 1);
    // Liegend
    ctx.fillStyle = scat.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, 20 * breathScale, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    // Kopf
    ctx.beginPath();
    ctx.arc(-18, -5, 8, 0, Math.PI * 2);
    ctx.fill();
    // Ohren
    ctx.fillStyle = shade(scat.color, -30);
    ctx.beginPath();
    ctx.moveTo(-22, -10);
    ctx.lineTo(-25, -18);
    ctx.lineTo(-18, -14);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-14, -10);
    ctx.lineTo(-11, -18);
    ctx.lineTo(-18, -14);
    ctx.fill();
    // Geschlossene Augen
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-22, -6);
    ctx.lineTo(-18, -4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-18, -4);
    ctx.lineTo(-14, -6);
    ctx.stroke();
    // Schwanz
    ctx.strokeStyle = scat.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(18, -2);
    ctx.quadraticCurveTo(28, -10 + Math.sin(scat.breathPhase) * 3, 25, -20);
    ctx.stroke();
    ctx.restore();
  }
  
  // Katzen zeichnen (sortiert nach Y für Tiefe)
  const sortedCats = [...cats].sort((a, b) => a.y - b.y);
  for (const cat of sortedCats) {
    drawCat(cat.x, cat.y, cat.size, cat.color, cat.dir, cat.frame, cat.action);
  }
  
  // Vignette
  const vig = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.8);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// === STEUERUNG ===
init();
loop();

let idleTimer = null, hintTimer = null;
function activity() {
  document.body.classList.remove('idle');
  document.getElementById('hint').style.opacity = 1;
  clearTimeout(idleTimer); clearTimeout(hintTimer);
  idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  hintTimer = setTimeout(() => document.getElementById('hint').style.opacity = 0, 2200);
}
['mousemove','mousedown','keydown','touchstart'].forEach(ev =>
  window.addEventListener(ev, activity, { passive:true }));
activity();

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
}
window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === ' ') { paused = !paused; e.preventDefault(); }
});
window.addEventListener('dblclick', toggleFullscreen);
</script>
</body>
</html>
